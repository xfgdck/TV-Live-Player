name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'native-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=keystore.jks \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Debug, OU=Dev, O=TVLivePlayer, L=Unknown, ST=Unknown, C=CN"
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=debug.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: TVLivePlayer-Release
          path: native-android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 万能电视直播 v${{ github.ref_name }}

            ### 更新说明
            - 自动构建版本
            - 请从下方 Assets 下载 APK 安装
          files: |
            native-android/app/build/outputs/apk/release/app-release*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
