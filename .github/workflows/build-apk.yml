name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'native-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found, downloading cmdline-tools..."
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | $SDKMANAGER --install "platforms;android-36" "build-tools;35.0.0" 2>&1
          yes | $SDKMANAGER --licenses 2>&1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          VERSION_CODE=$(date +%Y%m%d)
          VERSION_NAME=$(date +%Y.%m.%d)
          GRADLE_OPTS="-PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            ./gradlew assembleRelease --no-daemon \
              $GRADLE_OPTS \
              -Pandroid.injected.signing.store.file="$(pwd)/keystore.jks" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleDebug --no-daemon $GRADLE_OPTS
          fi
          echo "APK_VERSION=$VERSION_NAME" >> $GITHUB_ENV

      - name: Rename APK files
        run: |
          for apk in app/build/outputs/apk/*/*.apk; do
            dir=$(dirname "$apk")
            build_type=$(basename "$dir")
            mv "$apk" "$dir/TV-Live-Player-$APK_VERSION-$build_type.apk"
          done

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v6
        with:
          name: TV-Live-Player-${{ env.APK_VERSION }}
          path: native-android/app/build/outputs/apk/*/TV-Live-Player-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APK_VERSION }}
          name: v${{ env.APK_VERSION }}
          body: |
            ## TV-Live-Player ${{ env.APK_VERSION }}

            - 版本: ${{ env.APK_VERSION }}
            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
          files: |
            native-android/app/build/outputs/apk/*/TV-Live-Player-*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}