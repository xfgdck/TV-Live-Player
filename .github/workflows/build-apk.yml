name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build React Web App & Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (SPA)
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize & Sync Capacitor Android
        run: |
          # If capacitor config exists but android directory doesn't, add it
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Ensure Android 6 compatibility: lower target SDK to avoid new runtime behaviors
          # Patch variables.gradle
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 23/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 22/' android/variables.gradle
            echo "Patched variables.gradle for Android 6 compatibility:"
            cat android/variables.gradle
          fi
          # Sync the built static assets from dist/ to the android platform project
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Compile and Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Locate & Rename APK
        run: |
          # Find the generated APK and move/rename it for clean artifact name
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/tv-live-player-debug.apk
            echo "Successfully built and copied APK to build-output/"
          else
            echo "APK build file not found!"
            exit 1
          fi

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: tv-live-player-apk
          path: build-output/tv-live-player-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "TV Live Player — ${{ github.ref_name }}"
          tag_name: "release-${{ github.run_number }}"
          body: |
            ## 📦 自动构建 Release

            - **分支**: `${{ github.ref_name }}`
            - **提交**: `${{ github.sha }}`
            - **运行编号**: #${{ github.run_number }}

            > 由 GitHub Actions 自动编译发布，可直接下载 APK 安装到 Android TV 设备。

            ### 安装说明
            1. 下载下方 `tv-live-player-debug.apk`
            2. 通过 U 盘或 ADB 安装到电视盒子
            3. 最低支持 Android 6.0 (API 23)

          files: build-output/tv-live-player-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
